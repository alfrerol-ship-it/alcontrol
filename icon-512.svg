<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0f1923"/>
  <rect width="512" height="512" rx="112" fill="url(#grad)" opacity="0.4"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0099ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Border accent -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#00e5a0" stroke-width="4" opacity="0.3"/>
  <!-- AL$ text -->
  <text x="256" y="310" 
    font-family="'Arial Black', 'Helvetica Neue', sans-serif" 
    font-size="192" 
    font-weight="900"
    text-anchor="middle" 
    fill="#00e5a0"
    letter-spacing="-8">AL$</text>
  <!-- Bottom label -->
  <text x="256" y="400"
    font-family="'Arial', sans-serif"
    font-size="42"
    font-weight="400"
    text-anchor="middle"
    fill="#7a9bb5"
    letter-spacing="8">CONTROL</text>
</svg>
